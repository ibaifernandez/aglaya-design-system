<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AGLAYA — UI Kit</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="./assets/favicon-red.svg" type="image/svg+xml">
<link rel="stylesheet" href="./styles.css">
<style>
  /* Cross-section reactive aura on body */
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(circle 900px at var(--mx, 50%) var(--my, 50%),
      rgba(232,0,61,0.08), transparent 60%);
  }
</style>
</head>
<body>

<div id="app"></div>

<script>
  // Reactive aura
  document.addEventListener('mousemove', e => {
    document.body.style.setProperty('--mx', e.clientX + 'px');
    document.body.style.setProperty('--my', e.clientY + 'px');
  });
</script>

<!-- Vendored locally — zero external requests, works offline (React 18.3.1, Babel 7.29.0) -->
<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<script src="./vendor/babel.min.js"></script>

<script type="text/babel" src="./Primitives.jsx"></script>
<script type="text/babel" src="./Header.jsx"></script>
<script type="text/babel" src="./Hero.jsx"></script>
<script type="text/babel" src="./Problem.jsx"></script>
<script type="text/babel" src="./SystemsGrid.jsx"></script>
<script type="text/babel" src="./AntiClient.jsx"></script>
<script type="text/babel" src="./Footer.jsx"></script>

<script type="text/babel">
const App = () => (
  <React.Fragment>
    <Header/>
    <main>
      <Hero/>
      <Problem/>
      <SystemsGrid/>
      <AntiClient/>
    </main>
    <Footer/>
  </React.Fragment>
);

// Wait until Babel transpiles all scripts
const boot = () => {
  if (!window.Header || !window.Hero || !window.Problem || !window.SystemsGrid || !window.AntiClient || !window.Footer) {
    return requestAnimationFrame(boot);
  }
  ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
};
boot();
</script>

</body>
</html>
