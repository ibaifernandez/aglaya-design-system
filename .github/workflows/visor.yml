name: visor verificado

# Reconstruye el visor desde el canon en cada empujón a `main` y comprueba que
# lo construido está entero. NO despliega, y eso es una decisión, no un hueco.
#
# QUIÉN PUBLICA. Netlify lee este repositorio y construye sola con
# `netlify.toml`. Así **no hay ninguna llave de Netlify guardada en GitHub**:
# el repositorio es público, Netlify solo necesita leerlo, y una llave que no
# existe no se puede filtrar ni hay que rotarla. Decisión de Ibai, 2026-11-07.
#
# ENTONCES CONSTRUYEN DOS, Y ES A PROPÓSITO. Netlify construye para publicar;
# esto construye para medir. **No es duplicación: es la verificación.** Si se
# borra este workflow, la publicación se queda sin nadie que la mire — un
# `construir.py` roto se enteraría la página, no el PR. Por eso esto se queda
# aunque no despliegue nada, y por eso no es «un paso de más que simplificar».
#
# Lo que se publica NO está en el repositorio: `visor/publico/` es derivado y
# está en `.gitignore`, igual que `dist/`. Se fabrica en cada ejecución.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: construir y verificar el visor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Sin instalar nada: el generador corre con el Python del sistema, porque
      # `aglaya-ds-mcp/brand.py` no tiene dependencias.
      - name: construir el visor desde el canon
        run: python3 visor/construir.py

      - name: lo construido está completo
        # Una construcción que escribe medio sitio y sale con 0 es peor que una
        # que falla: publicaría una página a medias con cara de estar bien.
        run: |
          for f in index.html visor.css visor.js colors_and_type.css \
                   api/normas api/valores api/componentes api/productos; do
            test -s "visor/publico/$f" || { echo "falta o está vacío: $f"; exit 1; }
          done
          for lic in visor/publico/fonts/LICENSE-*.txt; do
            test -s "$lic" || { echo "una familia viajaría sin licencia"; exit 1; }
          done
          echo "ficheros: $(find visor/publico -type f | wc -l)"

      - name: el derivado no ensucia el árbol
        # `check-ignore` falla si alguien saca `visor/publico/` del .gitignore;
        # el segundo comando falla si la construcción tocó cualquier otra cosa.
        run: |
          git check-ignore -q visor/publico
          sucio="$(git status --porcelain)"
          test -z "$sucio" || { echo "El árbol quedó sucio:"; echo "$sucio"; exit 1; }
