name: huella
on: [push, pull_request]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tools/guard_huella.py
      - run: bash tools/test_guard_huella.sh   # que el guardián muerda, no solo que corra
