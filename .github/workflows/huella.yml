name: guardianes

# Cuatro guardianes y el MCP. Cada guardián corre DOS veces: el guardián y su
# batería de sabotaje. La batería no es ceremonia — un guardián puede correr y
# dar verde estando roto, y así se cazaron un patrón ciego a las MAYÚSCULAS,
# un precio que se colaba y un selftest que no podía ponerse rojo.
#
# Los cuatro pasos que comprueban «el árbol quedó como estaba» usan la MISMA
# forma, y es a propósito: `git status --porcelain` ve los archivos sin
# rastrear y `git diff --exit-code` NO. Medido, no leído de la documentación:
# en un repo con un archivo nuevo suelto, el primero sale 1 y el segundo sale
# 0. Tres de los cuatro usaban la forma ciega, así que prometían más de lo que
# medían — una prueba que CREARA un archivo pasaba inadvertida. Y se imprime lo
# que ensució: un guardián que se pone rojo sin decir qué cuesta una pasada
# entera averiguarlo.

on: [push, pull_request]

# Lectura para todos por defecto. El único job que escribe es `publicar-cifras`,
# y lo declara él solo (contrato `cifras-publicas` v1). Hoy el repositorio ya
# tiene «read» como permiso por defecto, pero eso es configuración que cambia
# fuera de este fichero: declararlo aquí es lo que lo garantiza.
permissions:
  contents: read

jobs:
  docs:
    name: guardianes de docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: huella de flota — sin afirmaciones de estado
        run: python3 tools/guard_huella.py
      - name: ¿la huella muerde?
        run: bash tools/test_guard_huella.sh

      - name: punteros — enlaces rotos y rutas del atlas
        run: python3 tools/guard_punteros.py
      - name: ¿los punteros muerden?
        run: bash tools/test_guard_punteros.sh

      - name: valores de marca — ninguno copiado fuera de su casa
        run: python3 tools/guard_valores.py
      - name: ¿los valores muerden?
        run: bash tools/test_guard_valores.sh

      - name: paquete — instalable desde fuera de esta máquina
        run: python3 tools/guard_paquete.py
      - name: ¿el paquete muerde?
        run: bash tools/test_guard_paquete.sh

      - name: ¿la publicación de cifras muerde? (cifra 0 o vacía no se publica)
        run: bash tools/test_publicar_cifras.sh

      - name: las baterías sabotean CLAUDE.md — que lo devuelvan como estaba
        run: |
          sucio="$(git status --porcelain)"
          test -z "$sucio" || { echo "El árbol quedó sucio:"; echo "$sucio"; exit 1; }

  mcp:
    name: MCP aglaya-ds
    runs-on: ubuntu-latest
    # Tres cifras públicas salen de la salida de ESTE job, en esta ejecución.
    # Si el selftest o su batería salen rojos, el job cae antes de medir y no
    # hay cifra; `publicar-cifras` no publica sin ellas.
    outputs:
      herramientas: ${{ steps.medir.outputs.herramientas }}
      llamadas: ${{ steps.medir.outputs.llamadas }}
      sabotajes: ${{ steps.medir.outputs.sabotajes }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: bootstrap del venv (el SDK es la única dependencia)
        working-directory: aglaya-ds-mcp
        run: |
          python3 -m venv .venv
          ./.venv/bin/python -m pip install -q --upgrade pip
          ./.venv/bin/python -m pip install -q -e .

      - name: selftest — todas las tools, con veredicto por llamada
        working-directory: aglaya-ds-mcp
        run: |
          set -o pipefail
          ./.venv/bin/python selftest.py | tee "$RUNNER_TEMP/selftest.log"

      - name: ¿el selftest muerde?
        working-directory: aglaya-ds-mcp
        run: |
          set -o pipefail
          bash test_selftest.sh | tee "$RUNNER_TEMP/test_selftest.log"

      - name: medir cifras públicas del MCP (de la salida de arriba)
        id: medir
        run: |
          for k in herramientas llamadas; do
            echo "$k=$(python3 tools/medir_cifras.py $k "$RUNNER_TEMP/selftest.log")" >> "$GITHUB_OUTPUT"
          done
          echo "sabotajes=$(python3 tools/medir_cifras.py sabotajes "$RUNNER_TEMP/test_selftest.log")" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: zero-copy — el token se lee en vivo, no se cachea
        working-directory: aglaya-ds-mcp
        run: ./.venv/bin/python zerocopy_test.py

      # Va en este job y no en `docs` porque necesita los TRES entornos a la vez:
      # Node, el venv del MCP y el python3 del sistema. Aquí es donde el venv ya
      # está montado.
      - name: los tres parsers coinciden y ninguno sirve lo comentado
        run: bash tools/test_parsers_comentarios.sh

      - name: las pruebas tocan archivos canónicos — que los devuelvan
        # zerocopy edita colors_and_type.css y test_selftest edita server.py;
        # los dos prometen restaurar. Aquí se comprueba que cumplen, que es
        # justo lo que nadie mira cuando el test sale verde. El bootstrap de
        # arriba deja `aglaya_ds_mcp.egg-info/`: derivado, y por eso ignorado.
        run: |
          sucio="$(git status --porcelain)"
          test -z "$sucio" || { echo "El árbol quedó sucio:"; echo "$sucio"; exit 1; }

  paquete:
    name: paquete @aglaya/design-tokens
    runs-on: ubuntu-latest
    # El recuento de tokens de ESTE build, para `publicar-cifras`.
    outputs:
      tokens: ${{ steps.medir.outputs.tokens }}
    steps:
      # fetch-depth 0: la prueba de mutación clona ESTE repo a un temporal, y
      # de un clon superficial no se puede clonar en todas las versiones de git.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # `setup-node` va en v7 porque la v4 está empaquetada para correr sobre
      # Node 20, que GitHub deprecó: el runner ya la forzaba a Node 24 y avisaba
      # en cada ejecución. Hoy funcionaba por una muleta que GitHub mantiene, y
      # el aviso era el anuncio de que la va a quitar — el día que la quiten,
      # este job se pone rojo solo, sin que nadie toque nada aquí.
      #
      # Eso es el tiempo de ejecución de la ACTION. El `node-version` de abajo
      # es otra cosa: es contra qué Node se prueba el paquete, o sea lo que
      # @aglaya/design-tokens demuestra soportar. Cambiarlo no es mantenimiento,
      # es una decisión sobre el producto — y por eso se queda donde está.
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: el build deriva los tokens del CSS canónico
        run: |
          set -o pipefail
          node scripts/build-tokens.mjs | tee "$RUNNER_TEMP/build-tokens.log"

      - name: medir cifra pública (tokens, de la salida del build)
        id: medir
        run: echo "tokens=$(python3 tools/medir_cifras.py tokens "$RUNNER_TEMP/build-tokens.log")" | tee -a "$GITHUB_OUTPUT"

      - name: dist/ es derivado — ignorado, y el build no ensucia el árbol
        # `check-ignore` falla si alguien saca dist/ del .gitignore; el segundo
        # comando falla si el build tocó cualquier otra cosa. guard_paquete
        # cubre el caso peor: que dist/ llegue a estar rastreado.
        run: |
          git check-ignore -q dist
          sucio="$(git status --porcelain)"
          test -z "$sucio" || { echo "El árbol quedó sucio:"; echo "$sucio"; exit 1; }

      - name: mutación — el consumidor consume, la copia no
        # La única prueba que distingue consumir de copiar. Monta dos
        # consumidores en un temporal: el que depende tiene que ver el cambio,
        # el que copió NO. Sin el segundo, la prueba no demuestra nada.
        run: bash tools/test_mutacion.sh

      - name: la mutación clona a un temporal — este repo no se toca
        run: |
          sucio="$(git status --porcelain)"
          test -z "$sucio" || { echo "El árbol quedó sucio:"; echo "$sucio"; exit 1; }

  publicar-cifras:
    # Contrato `cifras-publicas` v1 (formato del capitán: `contrato("cifras-publicas")`
    # del MCP `aglaya-atlas`). Deja `cifras.json` en la rama huérfana `cifras`.
    #
    # Solo en un push a main y solo si TODOS los jobs que miden salieron en
    # verde: `needs` hace que un rojo en cualquiera de ellos lo salte, y entonces
    # queda en la rama la última medición verde, con su fecha, que sigue siendo
    # verdad. Es el único job con permiso de escritura.
    #
    # Empujar a `cifras` no vuelve a disparar este workflow: la rama huérfana no
    # contiene `.github/`, y GitHub no lanza ejecuciones por pushes hechos con el
    # GITHUB_TOKEN. Lo segundo no se da por bueno por leerlo: se midió con la
    # primera publicación real, y el resultado está en la tarjeta `4b5faa4c`.
    name: publicar cifras (cifras-publicas v1)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docs, mcp, paquete]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publicar-cifras
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: publicar en la rama `cifras`
        env:
          CIFRAS_TOKENS: ${{ needs.paquete.outputs.tokens }}
          CIFRAS_HERRAMIENTAS: ${{ needs.mcp.outputs.herramientas }}
          CIFRAS_LLAMADAS: ${{ needs.mcp.outputs.llamadas }}
          CIFRAS_SABOTAJES: ${{ needs.mcp.outputs.sabotajes }}
          CIFRAS_COMMIT: ${{ github.sha }}
          CIFRAS_EJECUCION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash tools/publicar_cifras.sh
