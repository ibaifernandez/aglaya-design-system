[project]
name = "aglaya-ds-mcp"
version = "0.1.0"
description = "AGLAYA Design System — sovereign brand MCP: live-reads tokens, voice rules and logos from the canonical folder."
requires-python = ">=3.10"
# Sovereign core: stdlib only. The MCP SDK is the sole third-party dependency,
# and only the transport layer (server.py) touches it — brand.py has zero deps.
dependencies = [
    "mcp>=1.2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Layout plano con varios módulos sueltos: sin esta línea setuptools se niega
# a adivinar cuál es el paquete y aborta con «Multiple top-level modules
# discovered in a flat-layout». Es decir, el `pip install -e .` que manda el
# README fallaba para cualquiera que clonase el repo. Salió a la luz el día
# que CI empezó a hacer el bootstrap de verdad en vez de darlo por hecho.
# Se declaran solo el core y el transporte: las pruebas no son el paquete.
py-modules = ["brand", "server"]

[tool.aglaya]
# Los archivos canónicos que el core lee EN VIVO. Esta lista es documentación,
# no configuración: nada la carga. La autoridad son las constantes de
# `brand.py` (CSS_FILE, README_FILE, …), y se dejó atrás cuando el MCP aprendió
# identidad de producto y componentes — una lista a mano que envejeció dentro
# del repo que persigue justo eso.
canonical_files = [
    "../colors_and_type.css",        # tokens
    "../README.md",                  # voz, vocabulario protegido
    "../SKILL.md",                   # no-negociables (madre y producto)
    "../assets/",                    # logos
    "../products/products.json",     # roster e identidad de producto
    "../products/",                  # glyphs y lockups por producto
    "../components/components.json", # specs de componente
]
