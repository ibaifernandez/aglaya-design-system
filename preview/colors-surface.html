<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  body { padding: 24px; display: flex; align-items: center; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; width: 100%; }
  .swatch {
    flex: 1 1 110px;
    min-width: 110px;
    min-height: 100px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 14px 16px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #fff;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .hex { color: rgba(255,255,255,0.45); font-size: 9px; letter-spacing: 0.12em; }
  .s1 { background: #000000; }
  .s2 { background: var(--color-bg-deep); }
  .s3 { background: var(--color-surface); }
  .s4 { background: var(--color-surface-2); }
  .s5 { background: var(--color-surface-3); }
  .s6 { background: rgba(255,255,255,0.03); }
  .s7 { background: rgba(255,255,255,0.05); }
</style>
</head>
<body>
  <div class="row">
    <div class="swatch s1"><span>BG</span><span class="hex" data-token="--color-bg" data-case="upper"></span></div>
    <div class="swatch s2"><span>BG Deep</span><span class="hex" data-token="--color-bg-deep" data-case="upper"></span></div>
    <div class="swatch s3"><span>Surface</span><span class="hex" data-token="--color-surface" data-case="upper"></span></div>
    <div class="swatch s4"><span>Surface 2</span><span class="hex" data-token="--color-surface-2" data-case="upper"></span></div>
    <div class="swatch s5"><span>Surface 3</span><span class="hex" data-token="--color-surface-3" data-case="upper"></span></div>
    <div class="swatch s6"><span>Glass</span><span class="hex">wh/3%</span></div>
    <div class="swatch s7"><span>Glass+</span><span class="hex">wh/5%</span></div>
  </div>
  <script src="./_tokens.js"></script>
</body>
</html>
