<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #000; color: #fff; }
  body { padding: 28px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: center; gap: 16px; }
  .tag { font-family: var(--font-mono); font-size: 9px; letter-spacing: var(--tracking-widest); color: var(--color-corporate-green); width: 80px; flex-shrink: 0; text-transform: uppercase; }
  .eyebrow { font-family: var(--font-mono); font-weight: 900; font-size: 11px; letter-spacing: var(--tracking-ultra); color: var(--color-corporate-green); text-transform: uppercase; }
  .mono { font-family: var(--font-mono); font-size: 11px; letter-spacing: var(--tracking-widest); color: rgba(255,255,255,0.45); text-transform: uppercase; }
  .codetag { font-family: var(--font-mono); font-size: 10px; letter-spacing: var(--tracking-wider); background: #fff; color: #000; padding: 3px 8px; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="row"><span class="tag">Eyebrow</span><span class="eyebrow">SYSTEM_STATUS_01</span></div>
  <div class="row"><span class="tag">Mono</span><span class="mono">LOGIC_NODE_003 / PROTOCOL_ACTIVE</span></div>
  <div class="row"><span class="tag">Codetag</span><span class="codetag">REF_ID: 001_SOVEREIGNTY_LOGIC</span></div>
  <div class="row"><span class="tag">Terminal</span><span class="mono" style="color:#fff;">SYNCING<span style="color:var(--color-corporate-green);">...</span> &gt; DATA_SYNCHRONIZED</span></div>
</body>
</html>
