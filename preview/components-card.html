<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  body { padding: 24px; }
  .card {
    background: var(--color-surface-2); border: 1px solid rgba(255,255,255,0.05);
    padding: 28px; position: relative; overflow: hidden;
  }
  .top { display: flex; justify-content: space-between; margin-bottom: 20px; }
  /* No reimplementa el eyebrow: cita `.t-eyebrow` del canon y solo ajusta
     la composición. Un specimen que se lo reinventa enseña a reinventarlo. */
  .idx { font-size: 9px; font-weight: 400; opacity: 0.7; }
  .dot { width: 6px; height: 6px; background: var(--color-brand); }
  .title {
    font-family: var(--font-display); font-weight: 900; font-size: 22px;
    letter-spacing: var(--tracking-tight); text-transform: uppercase; color: #fff;
    margin: 0 0 12px; line-height: 1.1;
  }
  .body {
    font-family: var(--font-body); font-size: 13px; line-height: 1.55;
    color: rgba(255,255,255,0.45);
  }
  .rule { margin-top: 20px; width: 32px; height: 1px; background: rgba(255,255,255,0.1); }
  .card.hover { border-color: color-mix(in srgb, var(--color-brand) 40%, transparent); }
  .card.hover .rule { width: 100%; background: color-mix(in srgb, var(--color-brand) 20%, transparent); }
  .card.hover .title { color: var(--color-brand); }
</style>
</head>
<body>
  <div class="card hover">
    <div class="top">
      <span class="t-eyebrow idx">LOGIC_NODE_001</span>
      <span class="dot"></span>
    </div>
    <h3 class="title">The Rental Trap</h3>
    <p class="body">Stop building your empire on rented soil. When the contract ends, they walk away with your accounts, automations and hard-earned knowledge.</p>
    <div class="rule"></div>
  </div>
</body>
</html>
