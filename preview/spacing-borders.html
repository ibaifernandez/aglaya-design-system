<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #000; color: #fff; }
  body { padding: 24px; display: flex; gap: 20px; align-items: center; min-height: 100vh; }
  .card {
    flex: 1; background: #0c0c0c; padding: 24px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .a { border: 1px solid rgba(255,255,255,0.05); }
  .b { border: 1px solid rgba(255,255,255,0.2); }
  .c { border: 1px solid rgba(232,0,61,0.4); }
  .d { border: 2px solid #e8003d; }
  .tag { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.3em; color: rgba(255,255,255,0.5); text-transform: uppercase; }
  .title { font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 14px; text-transform: uppercase; letter-spacing: -0.01em; }
  .note { font-family: 'Inter', sans-serif; font-size: 12px; color: rgba(255,255,255,0.5); }
</style>
</head>
<body>
  <div class="card a">
    <span class="tag">wh / 5%</span>
    <span class="title">Default</span>
    <span class="note">Card separator</span>
  </div>
  <div class="card b">
    <span class="tag">wh / 20%</span>
    <span class="title">Strong</span>
    <span class="note">Input field</span>
  </div>
  <div class="card c">
    <span class="tag">brand / 40%</span>
    <span class="title">Hover</span>
    <span class="note">Card on hover</span>
  </div>
  <div class="card d">
    <span class="tag">brand solid 2px</span>
    <span class="title">Accent rule</span>
    <span class="note">Blockquote, focus</span>
  </div>
</body>
</html>
