<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #000; color: #fff; }
  body { padding: 20px 24px; font-family: 'Space Mono', monospace; }
  h4 {
    margin: 0 0 16px; font-family: 'Space Mono', monospace; font-size: 10px;
    letter-spacing: 0.35em; text-transform: uppercase; color: var(--color-corporate-green);
  }
  .row { display: flex; align-items: baseline; gap: 14px; margin-bottom: 8px; }
  .label {
    width: 100px; flex-shrink: 0;
    font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(255,255,255,0.4);
  }
  .spec {
    font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-text);
  }
  .r  { font-weight: 400; }
  .ri { font-weight: 400; font-style: italic; }
  .b  { font-weight: 700; }
  .bi { font-weight: 700; font-style: italic; }
  .tag {
    display: inline-block; margin-top: 10px;
    font-size: 9px; letter-spacing: 0.4em; text-transform: uppercase;
    color: var(--color-corporate-green);
  }
  .code {
    display: inline-block; margin-top: 4px;
    padding: 2px 8px; background: #fff; color: #000;
    font-size: 10px; letter-spacing: 0.15em;
  }
</style>
</head>
<body>
  <h4>Space Mono — local brand files</h4>
  <div class="row"><span class="label">400 Regular</span>     <span class="spec r">REF_ID: 001_SOVEREIGNTY_LOGIC</span></div>
  <div class="row"><span class="label">400 Italic</span>      <span class="spec ri">data_stream_vacuum</span></div>
  <div class="row"><span class="label">700 Bold</span>        <span class="spec b">SYSTEM_INTEGRITY_OK</span></div>
  <div class="row"><span class="label">700 Bold Italic</span> <span class="spec bi">priority_case_pending</span></div>
  <div class="tag">USAGE</div>
  <div><span class="code">CODETAG_UPPERCASE</span></div>
</body>
</html>
