<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #000; color: #fff; }
  body { padding: 28px; }
  .specimen { display: flex; flex-direction: column; gap: 12px; }
  .line { display: flex; align-items: baseline; gap: 16px; }
  .tag { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--color-corporate-green); width: 90px; flex-shrink: 0; }
  .sample { font-family: 'Outfit', sans-serif; font-weight: 900; letter-spacing: -0.03em; text-transform: uppercase; color: #fff; line-height: 0.95; }
</style>
</head>
<body>
  <div class="specimen">
    <div class="line"><span class="tag">Display XL</span><span class="sample" style="font-size: 72px;">Sovereign.</span></div>
    <div class="line"><span class="tag">Display LG</span><span class="sample" style="font-size: 52px;">Zero leak.</span></div>
    <div class="line"><span class="tag">Display MD</span><span class="sample" style="font-size: 36px;">Systemic Alpha.</span></div>
  </div>
</body>
</html>
