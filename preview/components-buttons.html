<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  body { padding: 24px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; min-height: 100vh; }
  .btn-primary {
    background: #e8003d; color: #fff; border: none;
    padding: 18px 22px;
    font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 13px;
    letter-spacing: 0.2em; text-transform: uppercase;
    cursor: pointer; position: relative; display: inline-flex; gap: 8px;
  }
  .btn-primary .shadow {
    position: absolute; inset: 0; border: 1px solid rgba(255,255,255,0.2);
    transform: translate(4px, 4px); z-index: -1;
  }
  .btn-ghost {
    background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2);
    padding: 12px 20px;
    font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 11px;
    letter-spacing: 0.2em; text-transform: uppercase;
    display: inline-flex; gap: 8px; align-items: center;
  }
  .btn-link {
    font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.3em;
    text-transform: uppercase; color: rgba(255,255,255,0.45);
    display: inline-flex; align-items: center; gap: 14px;
  }
  .btn-link .rule { width: 40px; height: 1px; background: rgba(255,255,255,0.2); }
</style>
</head>
<body>
  <button class="btn-primary">Request Proposal →<span class="shadow"></span></button>
  <button class="btn-ghost">Contact <span>→</span></button>
  <a class="btn-link">See the proof <span class="rule"></span></a>
</body>
</html>
