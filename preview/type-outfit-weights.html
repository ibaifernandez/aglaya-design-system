<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #000; color: #fff; }
  body { padding: 20px 24px; font-family: 'Outfit', sans-serif; }
  h4 {
    margin: 0 0 14px; font-family: 'Space Mono', monospace; font-size: 10px;
    letter-spacing: 0.35em; text-transform: uppercase; color: #9fc243;
  }
  .row { display: flex; align-items: baseline; gap: 16px; margin-bottom: 4px; }
  .label {
    width: 90px; flex-shrink: 0;
    font-family: 'Space Mono', monospace; font-size: 9px;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(255,255,255,0.4);
  }
  .spec {
    font-size: 22px; color: #fff;
    letter-spacing: -0.02em; text-transform: uppercase;
  }
  .o200 { font-weight: 200; }
  .o300 { font-weight: 300; }
  .o400 { font-weight: 400; }
  .o500 { font-weight: 500; }
  .o600 { font-weight: 600; }
  .o700 { font-weight: 700; }
  .o800 { font-weight: 800; }
  .o900 { font-weight: 900; }
</style>
</head>
<body>
  <h4>Outfit — local brand files, ExtraLight 200 → Black 900</h4>
  <div class="row"><span class="label">200 XLight</span>    <span class="spec o200">Sovereign Systems</span></div>
  <div class="row"><span class="label">300 Light</span>     <span class="spec o300">Sovereign Systems</span></div>
  <div class="row"><span class="label">400 Regular</span>   <span class="spec o400">Sovereign Systems</span></div>
  <div class="row"><span class="label">500 Medium</span>    <span class="spec o500">Sovereign Systems</span></div>
  <div class="row"><span class="label">600 SemiBold</span>  <span class="spec o600">Sovereign Systems</span></div>
  <div class="row"><span class="label">700 Bold</span>      <span class="spec o700">Sovereign Systems</span></div>
  <div class="row"><span class="label">800 XBold</span>     <span class="spec o800">Sovereign Systems</span></div>
  <div class="row"><span class="label">900 Black</span>     <span class="spec o900">Sovereign Systems</span></div>
</body>
</html>
