<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #000; color: #fff; }
  body { padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: center; gap: 14px; }
  .name { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.3em; color: rgba(255,255,255,0.6); text-transform: uppercase; width: 120px; }
  .box { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); }
  .px { font-family: 'Space Mono', monospace; font-size: 9px; color: rgba(255,255,255,0.4); letter-spacing: 0.15em; }
</style>
</head>
<body>
  <div class="row"><span class="name">space-2</span><div class="box" style="width:8px;height:20px;"></div><span class="px">8 / 0.5rem</span></div>
  <div class="row"><span class="name">space-4</span><div class="box" style="width:16px;height:20px;"></div><span class="px">16 / 1rem</span></div>
  <div class="row"><span class="name">space-6</span><div class="box" style="width:24px;height:20px;"></div><span class="px">24 / 1.5rem</span></div>
  <div class="row"><span class="name">space-10</span><div class="box" style="width:40px;height:20px;"></div><span class="px">40 / 2.5rem</span></div>
  <div class="row"><span class="name">space-16</span><div class="box" style="width:64px;height:20px;"></div><span class="px">64 / 4rem</span></div>
  <div class="row"><span class="name">space-20</span><div class="box" style="width:80px;height:20px;"></div><span class="px">80 / 5rem  (section py)</span></div>
</body>
</html>
