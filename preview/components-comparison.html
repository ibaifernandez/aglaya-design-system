<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #000; color: #fff; }
  body { padding: 24px; }
  .row { display: flex; gap: 16px; align-items: stretch; }
  .cell {
    flex: 1; border: 1px solid rgba(255,255,255,0.1); padding: 18px;
    background: rgba(255,255,255,0.02);
  }
  .cell.brand { border-color: color-mix(in srgb, var(--color-brand) 30%, transparent); background: color-mix(in srgb, var(--color-brand) 5%, transparent); }
  .eyebrow {
    display: inline-block;
    font-family: 'Space Mono', monospace; font-size: 9px;
    letter-spacing: 0.3em; text-transform: uppercase;
    padding: 3px 8px; border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.6);
    margin-bottom: 10px;
  }
  .cell.brand .eyebrow { color: var(--color-corporate-green); background: color-mix(in srgb, var(--color-brand) 10%, transparent); border-color: color-mix(in srgb, var(--color-brand) 20%, transparent); }
  .title { font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 18px; text-transform: uppercase; letter-spacing: -0.01em; margin-bottom: 14px; }
  .dl dt { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.32em; color: rgba(255,255,255,0.5); text-transform: uppercase; }
  .dl dd { font-family: 'Inter', sans-serif; font-size: 13px; margin: 2px 0 10px; color: rgba(255,255,255,0.85); }
</style>
</head>
<body>
  <div class="row">
    <article class="cell">
      <span class="eyebrow">Expense Model</span>
      <div class="title">Traditional Agency</div>
      <dl class="dl">
        <dt>Ownership</dt><dd>Zero</dd>
        <dt>Value decay</dt><dd>High / immediate</dd>
      </dl>
    </article>
    <article class="cell brand">
      <span class="eyebrow">Equity Model</span>
      <div class="title">AGLAYA Systemic</div>
      <dl class="dl">
        <dt>Ownership</dt><dd>100% client-owned</dd>
        <dt>Value decay</dt><dd>Near-zero</dd>
      </dl>
    </article>
  </div>
</body>
</html>
