<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #000; color: #fff; }
  body { padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .rule {
    display: flex; align-items: center; gap: 14px;
    font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.25em;
    text-transform: uppercase; color: rgba(255,255,255,0.55);
  }
  .pill { padding: 6px 10px; border: 1px dashed rgba(232,0,61,0.5); color: #e8003d; }
  code { font-family: 'Space Mono', monospace; background: rgba(255,255,255,0.95); color: #000; padding: 2px 8px; letter-spacing: 0.1em; }
</style>
</head>
<body>
  <div class="rule"><span class="pill">Rule #01</span><span>All radii = <code>0</code></span></div>
  <div class="rule"><span class="pill">Rule #02</span><span>No drop shadow, ever</span></div>
  <div class="rule"><span class="pill">Rule #03</span><span>Glow only on brand CTA hover: <code>0 6px 25px rgba(232,0,61,.4)</code></span></div>
  <div class="rule"><span class="pill">Rule #04</span><span>Depth by stacking surfaces, not shadows</span></div>
  <div class="rule"><span class="pill">Rule #05</span><span>Exception: cursor dot + flag pips = <code>border-radius: 50%</code></span></div>
</body>
</html>
