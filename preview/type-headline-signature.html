<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  body { padding: 32px; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .headline { font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 56px; line-height: 0.95; letter-spacing: -0.03em; text-transform: uppercase; color: #fff; }
  .brand { color: var(--color-brand); display: block; }
</style>
</head>
<body>
  <h1 class="headline">
    The agency is dead.
    <span class="brand">Long live the system.</span>
  </h1>
</body>
</html>
