<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#000;color:#fff;font-family:ui-monospace,Menlo,monospace}
  body{padding:24px;display:flex;flex-direction:column;gap:14px}
  h3{margin:0;font-family:'Outfit',sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:-0.01em;font-size:16px}
  .row{display:flex;align-items:center;gap:14px}
  .ico{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,0.08)}
  .name{font-size:10px;letter-spacing:0.3em;color:rgba(255,255,255,0.5);text-transform:uppercase}
  .sq{width:8px;height:8px;background:#e8003d}
  .sq-sm{width:4px;height:4px;background:rgba(232,0,61,0.4)}
  svg{display:block}
</style>
</head>
<body>
  <h3>Iconography — line stroke, brand accent</h3>
  <div class="row">
    <div class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e8003d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg></div>
    <span class="name">ARROW (INLINE SVG)</span>
  </div>
  <div class="row">
    <div class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14"/><path d="M3 7l9 7 9-7"/></svg></div>
    <span class="name">MAIL</span>
  </div>
  <div class="row">
    <div class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H6l-2 4z"/></svg></div>
    <span class="name">MESSAGE</span>
  </div>
  <div class="row">
    <div class="ico"><span class="sq"></span></div>
    <span class="name">DECORATIVE SQUARE — BULLET</span>
  </div>
  <div class="row">
    <div class="ico"><span class="sq-sm"></span></div>
    <span class="name">DECORATIVE SQUARE — PIP (40%)</span>
  </div>
</body>
</html>
