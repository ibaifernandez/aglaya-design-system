<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Esta página enseña la paleta, así que la USA: nada de valores cableados.
     Antes llevaba #000, #fff y rgba(255,255,255,…) escritos a mano, y con dos
     modos eso la habría dejado enseñando el oscuro para siempre — la página de
     la paleta mintiendo sobre la paleta. */
  html, body { margin: 0; padding: 0; background: var(--color-bg); }
  body { padding: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: center; min-height: 100vh; }
  .row { display: flex; align-items: center; gap: 16px; padding: 10px 14px; border: 1px solid var(--color-border); }
  .chip { width: 40px; height: 40px; flex-shrink: 0; border: 1px solid var(--color-border-strong); }
  .label { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; }
  .name { color: var(--fg-1); display: block; }
  .hex { color: var(--fg-3); font-size: 9px; letter-spacing: 0.1em; }
  .text-demo { font-family: 'Inter', sans-serif; font-size: 13px; }
  #modo { grid-column: 1 / -1; justify-self: start; font-family: 'Space Mono', monospace;
          font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
          color: var(--fg-2); background: var(--color-surface);
          border: 1px solid var(--color-border-strong); padding: 8px 14px; cursor: pointer; }
</style>
</head>
<body>
  <!-- El claro se PIDE: sin data-theme, lo que se ve es el oscuro de siempre. -->
  <button id="modo" type="button">modo: <span id="modo-txt">oscuro</span></button>
  <div class="row">
    <div class="chip" style="background: var(--fg-1);"></div>
    <div class="label"><span class="name">fg-1 / Text</span><span class="hex" data-token="--color-text" data-case="upper"></span></div>
  </div>
  <div class="row">
    <div class="chip" style="background: var(--fg-2);"></div>
    <div class="label"><span class="name">fg-2 / Muted</span><span class="hex" data-token="--color-muted"></span></div>
  </div>
  <div class="row">
    <div class="chip" style="background: var(--fg-3);"></div>
    <div class="label"><span class="name">fg-3 / Faint</span><span class="hex" data-token="--color-faint"></span></div>
  </div>
  <div class="row">
    <div class="chip" style="background: var(--fg-brand);"></div>
    <div class="label"><span class="name">fg-brand</span><span class="hex" data-token="--color-brand" data-case="upper"></span></div>
  </div>
  <div class="row">
    <div class="chip" style="background: var(--fg-eyebrow);"></div>
    <div class="label"><span class="name">fg-eyebrow</span><span class="hex" data-token="--color-corporate-green" data-case="upper"></span></div>
  </div>
  <div class="row">
    <div class="chip" style="background: var(--color-border); border-color: var(--color-border-strong);"></div>
    <div class="label"><span class="name">border</span><span class="hex" data-token="--color-border"></span></div>
  </div>
  <script src="./_tokens.js"></script>
  <script>
    // El botón alterna data-theme en <html>. Los hex de cada fila los pinta
    // _tokens.js leyendo el valor computado, así que al cambiar de modo hay
    // que volver a pedirlos: si no, la página enseñaría los colores nuevos con
    // los números viejos, que es peor que no tener modo claro.
    document.getElementById('modo').addEventListener('click', () => {
      const raiz = document.documentElement;
      const claro = raiz.getAttribute('data-theme') === 'light';
      if (claro) raiz.removeAttribute('data-theme');
      else raiz.setAttribute('data-theme', 'light');
      document.getElementById('modo-txt').textContent = claro ? 'oscuro' : 'claro';
      document.querySelectorAll('[data-token]').forEach((el) => { el.textContent = ''; });
      if (window.pintarTokens) window.pintarTokens();
    });
  </script>
</body>
</html>
