<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  body { padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .field {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.35);
    padding: 14px 16px;
    font-family: 'Inter', sans-serif; font-size: 13px;
    color: rgba(255,255,255,0.5);
  }
  .field.focus {
    border-color: rgba(232,0,61,0.5);
    background: rgba(232,0,61,0.03);
    color: #fff;
    outline: 2px solid rgba(232,0,61,0.9);
    outline-offset: 2px;
  }
  .area { min-height: 56px; }
  .label {
    font-family: 'Space Mono', monospace; font-size: 9px;
    letter-spacing: 0.3em; color: #9fc243; text-transform: uppercase;
    margin-bottom: 4px;
  }
</style>
</head>
<body>
  <div>
    <div class="label">Corporate Email</div>
    <div class="field">name@company.com</div>
  </div>
  <div>
    <div class="label">Operational Bottlenecks</div>
    <div class="field focus">Describe the systems you want AGLAYA to audit</div>
  </div>
</body>
</html>
